[project]
name = "netusage"
version = "0.1.0"
description = "Medallion-architecture network access analytics pipeline in PySpark (synthetic data)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# PySpark and Delta are provided by Databricks at runtime (Spark 4.2.0 on serverless).
# Locally: pyspark pinned to 4.2.0 because delta-spark 4.4.x supports pyspark <=4.2.0.
dev = [
    "pyspark==4.2.0",
    "delta-spark>=4.4.1,<4.5",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netusage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark/dbutils/display are injected globals; imports follow sys.path setup.
"notebooks/*" = ["F821", "E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
